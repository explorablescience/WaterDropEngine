[package]
name = "wde-game"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bytemuck = { version = "1.14", features = [ "derive" ] }

[dependencies.wde]
version = "0.1.0"
path = "../crates/wde"
features = [
    "gizmos"
]

[dependencies.bevy]
version = "0.17"
default-features = false
features = [
    "multi_threaded",
    "bevy_asset",
    "bevy_winit",
    "x11"
]

[build-dependencies]
anyhow = "1.0"
fs_extra = "1.2"

[features]
default = []
remote = ["wde/remote"]
watch = ["wde/watch"]
trace = ["wde/trace"]
