[package]
name = "wde"
version = "0.1.0"
edition = "2021"
description = "WaterDropEngine - A modular game engine written in Rust."

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[dependencies]
wde-renderer = { path = "../render/wde-renderer" }
wde-wgpu = { path = "../core/wde-wgpu" }
wde-scene = { path = "../scene/wde-scene" }
bytemuck = { version = "1.14", features = [ "derive" ] }
# physx = "0.19"
# physx-sys = "0.11"

[dependencies.bevy]
version = "0.17"
default-features = false
features = [
    "multi_threaded",
    "bevy_asset",
    "bevy_winit",
    "x11"
]

[features]
default = []
remote = ["bevy/bevy_remote"]
watch = ["bevy/file_watcher", "wde-renderer/watch"]
trace = ["bevy/trace_tracy_memory", "wde-renderer/trace"]
