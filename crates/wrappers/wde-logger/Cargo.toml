[package]
name = "wde-logger"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true }
backtrace = "0.3"
sysinfo = "0.40"
uuid = { version = "1.23", features = ["v4"], default-features = false }
toml = "1.1"
serde = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", features = ["registry", "env-filter"] }
tracing-log = "0.2.0"
tracing-appender = "0.2.0"
tracing-error = { version = "0.2.0", optional = true }

# See https://github.com/nagisa/rust_tracy_client
tracing-tracy = { version = "0.12.0", optional = true }
tracy-client = { version = "0.19.0", optional = true }
# Pinned: the protocol must match the profiler in tracy/ (Tracy 0.14.1)
tracy-client-sys = { version = "=0.30.1", optional = true, default-features = false }
puffin = { git = "https://github.com/EmbarkStudios/puffin.git", rev = "39c8970", optional = true }

[features]
debug = ["tracing/max_level_debug"]
tracing = ["bevy/trace", "bevy/trace_tracy", "bevy/trace_tracy_memory", "tracing-tracy", "tracy-client", "tracy-client-sys", "dep:tracing-error"]
puffin = ["bevy/trace", "dep:puffin"]
editor = []
