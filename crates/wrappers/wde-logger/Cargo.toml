[package]
name = "wde-logger"
version = "0.1.0"
authors = ["MecanicaScience"]
edition = "2024"
description = "A logging crate for WaterDropEngine"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[dependencies]
bevy = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.20", features = ["registry", "env-filter"] }
tracing-log = "0.2.0"
tracing-error = { version = "0.2.0", optional = true }

# See https://github.com/nagisa/rust_tracy_client
tracing-tracy = { version = "0.11.4", optional = true }
tracy-client = { version = "0.18.3", optional = true }
puffin = { git = "https://github.com/explorablescience/puffin.git", rev = "56ece9e", optional = true }

[features]
default = []
tracing = ["bevy/trace", "bevy/trace_tracy", "bevy/trace_tracy_memory", "tracing-tracy", "tracy-client", "tracing-error"]
puffin = ["bevy/trace", "dep:puffin"]
