[package]
name = "wde-wgpu"
version = "0.1.0"
authors = ["MecanicaScience"]
edition = "2024"
description = "WaterDropEngine's wgpu wrapper crate"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[dependencies]
wde-logger = { path = "../wde-logger" }
wgpu = { version = "27", features = [ "serde" ] }
bevy = { workspace = true }
serde = { workspace = true }
bytemuck = { workspace = true}
