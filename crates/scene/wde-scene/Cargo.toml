[package]
name = "wde-scene"
version = "0.1.0"
edition = "2024"
description = "High-level scene management for WaterDropEngine."

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[dependencies]
wde-renderer = { path = "../../render/wde-renderer" }
wde-wgpu = { path = "../../core/wde-wgpu" }
wde-pbr = { path = "../../render/wde-pbr" }
wde-camera = { path = "../../render/wde-camera" }
bevy = { workspace = true }
serde = { workspace = true }
bytemuck = { workspace = true }
serde_json = "1.0"

[features]
default = []
remote = ["bevy/bevy_remote"]
watch = ["bevy/file_watcher", "wde-renderer/watch"]
trace = ["bevy/trace_tracy_memory", "wde-renderer/trace"]
