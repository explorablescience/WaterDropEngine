[package]
name = "wde"
version = "0.1.0"
edition = "2024"

[dependencies]
# Always included
wde-logger = { path = "../../wrappers/wde-logger" }
wde-renderer = { path = "../wde-renderer" }
wde-scene = { path = "../wde-scene" }
bevy = { workspace = true }

# Optional modules
wde-camera = { path = "../../render/wde-camera", optional = true }
wde-camera-controller = { path = "../../render/wde-camera-controller", optional = true }
wde-pbr = { path = "../../render/wde-pbr", optional = true, default-features = false }
wde-pbr-outline = { path = "../../render/wde-pbr-outline", optional = true }
wde-gltf = { path = "../../render/wde-gltf", optional = true }
wde-animation = { path = "../../render/wde-animation", optional = true }
wde-gizmos = { path = "../../render/wde-gizmos", optional = true }
wde-ui = { path = "../../render/wde-ui", optional = true }
wde-physics = { path = "../../wrappers/wde-physics", optional = true }
wde-terrain = { path = "../../terrain/wde-terrain", optional = true }
wde-terrain-editor = { path = "../../terrain/wde-terrain-editor", optional = true }
wde-editor = { path = "../wde-editor", optional = true }

[features]
default = ["minimal"]

# Presets. Without default features, only the renderer, logger and scene are included.
minimal = ["pbr", "gltf", "camera-controller"]
full = ["minimal", "atmosphere", "pbr-outline", "gizmos", "ui", "physics", "terrain"]
everything = ["full", "editor", "terrain-editor"]

# Modules
camera = ["dep:wde-camera"]
camera-controller = ["camera", "dep:wde-camera-controller"]
pbr = ["camera", "dep:wde-pbr"]
atmosphere = ["pbr", "wde-pbr/atmosphere"]
pbr-outline = ["pbr", "dep:wde-pbr-outline"]
gltf = ["pbr", "animation", "dep:wde-gltf"]
animation = ["dep:wde-animation"]
gizmos = ["pbr", "dep:wde-gizmos"]
ui = ["dep:wde-ui"]
physics = ["camera", "dep:wde-physics"]
terrain = ["pbr", "gizmos", "physics", "dep:wde-terrain"]
terrain-editor = ["terrain", "editor", "dep:wde-terrain-editor"]
editor = ["dep:wde-editor", "wde-renderer/editor", "wde-logger/editor"]

# Development
log-debug = ["wde-logger/debug"]
debug = ["bevy/debug"]
watch = ["bevy/file_watcher"]
tracing = ["wde-logger/tracing", "bevy/trace_tracy_memory", "wde-logger/puffin"]
gpu-debug = ["wde-renderer/gpu-debug"]
