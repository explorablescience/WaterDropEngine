[package]
name = "wde-scene"
version = "0.1.0"
edition = "2024"
description = "The scene system for the game engine."

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[dependencies]
wde-logger = { path = "../../wrappers/wde-logger" }
bevy = { workspace = true }
serde_json = "1.0"
