[package]
name = "wde-renderer"
version = "0.1.0"
edition = "2024"

[dependencies]
wde-logger = { path = "../../wrappers/wde-logger" }
wde-wgpu = { path = "../../wrappers/wde-wgpu" }
bevy = { workspace = true }
serde = { workspace = true }
bytemuck = { workspace = true }
thiserror = "1.0"
tobj = "4.0"
async-channel = "2.3"

[dependencies.image]
version = "0.25"
default-features = false
features = ["png", "jpeg"]

[features]
default = []
editor = []
gpu-debug = ["wde-wgpu/gpu-debug"]
