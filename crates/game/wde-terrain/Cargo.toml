[package]
name = "wde-terrain"
version = "0.1.0"
edition = "2024"
description = "The terrain module for WaterDrop Engine, providing terrain generation and management."

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[dependencies]
wde-logger = { path = "../../wrappers/wde-logger" }
wde-renderer = { path = "../../core/wde-renderer" }
wde-wgpu = { path = "../../wrappers/wde-wgpu" }
wde-camera = { path = "../../render/wde-camera" }
wde-pbr = { path = "../../render/wde-pbr" }
wde-physics = { path = "../../wrappers/wde-physics" }
bevy = { workspace = true }
bytemuck = { workspace = true }
