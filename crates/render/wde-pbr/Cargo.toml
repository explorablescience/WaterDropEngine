[package]
name = "wde-pbr"
version = "0.1.0"
edition = "2024"
description = "Physically based rendering for WaterDropEngine."

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[dependencies]
wde-renderer = { path = "../wde-renderer" }
bevy = { workspace = true }

[features]
default = []
watch = ["bevy/file_watcher"]
trace = ["bevy/trace_tracy_memory"]
