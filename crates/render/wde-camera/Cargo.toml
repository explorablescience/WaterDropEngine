[package]
name = "wde-camera"
version = "0.1.0"
edition = "2024"
description = "Camera module for WaterDropEngine"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false

[dependencies]
wde-logger = { path = "../../wrappers/wde-logger" }
wde-renderer = { path = "../../core/wde-renderer" }
bevy = { workspace = true }
bytemuck = { workspace = true }
